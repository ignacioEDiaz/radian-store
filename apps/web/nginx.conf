server {
  listen 80;
  root /usr/share/nginx/html;
  client_max_body_size 12m;

  gzip on;
  gzip_types text/css application/javascript text/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  location ~ ^/(api|media|health)/ {
    proxy_pass http://api:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Bundle de la aplicación: nombres con hash, se pueden cachear para siempre.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Archivos del tema original (estilos, scripts, imágenes, videos). Si falta uno es un 404,
  # nunca el HTML de la aplicación.
  location ~ ^/(cdn|_hosts)/ {
    add_header Cache-Control "public, max-age=2592000";
    try_files $uri =404;
  }

  # La home es el documento original del tema.
  location = / {
    add_header Cache-Control "no-cache";
    try_files /index.html =404;
  }

  # El resto de las rutas las resuelve React dentro del marco del tema.
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri /app.html;
  }
}
